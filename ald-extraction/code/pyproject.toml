[project]
name = "ald-extract"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pdfplumber>=0.11", "pillow"]
[project.optional-dependencies]
neo4j = ["neo4j>=5"]
dev = ["pytest", "reportlab"]
[project.scripts]
ald-extract = "ald_extract.cli:main"
[tool.setuptools]
packages = ["ald_extract"]
